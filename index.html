    if (acao === 'fb-seguir') {
      lerCampos(); salvarSessao();
      st.fbPendente = null; st.aberto = primeiroAberto(s); render(); return;
    }
    if (acao === 'ex-evo') { st.exEvo = b.dataset.ex; render(); return; }
    if (acao === 'checkin') {
      lerCampos();
      s.checkin = s.checkin || {};
      const v = Number(b.dataset.v), c = b.dataset.campo;
      s.checkin[c] = s.checkin[c] === v ? null : v;
      if (st.sessaoSalva || seriesFeitas(s) || s.status === 'concluido') salvarSessao();
      render(); return;
    }
    if (acao === 'fase') {
      const v = b.dataset.v;
      store.config = Object.assign({}, store.config, { fase: v === 'auto' ? null : Number(v), atualizadoEm: new Date().toISOString() });
      espelhar(); enfileirar({ tipo: 'config', dados: store.config });
      regenerarSeLivre(); render();
      toast(v === 'auto' ? 'Fase pela data.' : 'Fase ' + v + ' a partir do próximo treino.');
      return;
    }
    if (acao === 'tipo') { const ex = st.rascunho[b.dataset.t][Number(b.dataset.i)]; ex.tipo = ex.tipo === 'tempo' ? 'carga' : 'tempo'; render(); return; }
    if (acao === 'mover') {
      const arr = st.rascunho[b.dataset.t], i = Number(b.dataset.i), j = i + Number(b.dataset.d);
      if (j < 0 || j >= arr.length) return;
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp; render(); return;
    }
    if (acao === 'remover') {
      const arr = st.rascunho[b.dataset.t];
      if (arr.length <= 1) { toast('Cada treino precisa de pelo menos um exercício.'); return; }
      arr.splice(Number(b.dataset.i), 1); render(); return;
    }
    if (acao === 'add-ex') {
      st.rascunho[b.dataset.t].push({ id: '', nome: '', tipo: 'carga' }); render();
      const arr = st.rascunho[b.dataset.t];
      const el = document.getElementById('nm-' + b.dataset.t + '-' + (arr.length - 1)); if (el) el.focus();
      return;
    }
    if (acao === 'salvar-plano') {
      const r = st.rascunho;
      for (const t of ['A', 'B']) {
        for (const ex of r[t]) {
          ex.nome = (ex.nome || '').trim();
          if (!ex.nome) { toast('Dê um nome a cada exercício do treino ' + t + ' ou remova o vazio.'); return; }
          if (!ex.id) ex.id = slug(ex.nome);
        }
      }
      store.plano = { A: clone(r.A), B: clone(r.B), atualizadoEm: new Date().toISOString() };
      espelhar(); enfileirar({ tipo: 'plano', dados: store.plano });
      regenerarSeLivre(); render(); toast('Treinos salvos.');
      return;
    }
    if (acao === 'padrao') { st.confirmarPadrao = true; render(); return; }
    if (acao === 'padrao-nao') { st.confirmarPadrao = false; render(); return; }
    if (acao === 'padrao-ok') {
      st.confirmarPadrao = false;
      store.plano = null; espelhar(); enfileirar({ tipo: 'plano', dados: null });
      st.rascunho = clone(PLANO_PADRAO); regenerarSeLivre(); render(); toast('Treinos originais de volta.');
      return;
    }
    if (acao === 'hist') { st.histAberto = st.histAberto === b.dataset.id ? null : b.dataset.id; render(); return; }
    if (acao === 'apagar-peso') { st.apagarPeso = b.dataset.d; render(); return; }
    if (acao === 'apagar-peso-nao') { st.apagarPeso = null; render(); return; }
    if (acao === 'apagar-peso-ok') {
      const d = b.dataset.d; st.apagarPeso = null;
      delete store.pesos[d]; espelhar(); enfileirar({ tipo: 'peso_del', dados: d });
      render(); toast('Pesagem apagada.'); return;
    }
    if (acao === 'conectar') {
      const url = ((st.cx && st.cx.url) || '').trim();
      const chave = ((st.cx && st.cx.chave) || '').trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { toast('Cole a URL do app da Web, a que termina em /exec.'); return; }
      if (!chave) { toast('Cole a chave que está no script.'); return; }
      store.conexao = { url: url, chave: chave }; gravarLocal();
      b.disabled = true; b.textContent = 'Conectando…';
      baixar().then((n) => {
        st.erroSync = null; st.cx = null;
        if (st.sessao && !st.sessaoSalva && seriesFeitas(st.sessao) === 0) iniciarSessao();
        render();
        toast('Conectado: ' + n.sessoes + (n.sessoes === 1 ? ' treino' : ' treinos') + ' e ' + n.pesos + (n.pesos === 1 ? ' pesagem.' : ' pesagens.'));
        agendarEnvio(0);
      }).catch((e) => {
        st.erroSync = e && e.message === 'chave' ? 'chave' : 'rede'; render();
        toast(st.erroSync === 'chave' ? 'A planilha recusou a chave. Confira se é a mesma do script.' : 'Não consegui falar com a planilha. Confira a URL e a internet.');
      });
      return;
    }
    if (acao === 'enviar-agora') {
      if (!store.fila.length) { toast('Nada pendente.'); return; }
      if (navigator.onLine === false) { toast('Sem internet agora. Envio assim que voltar.'); return; }
      st.erroSync = null; agendarEnvio(0); toast('Enviando.'); return;
    }
    if (acao === 'desconectar') {
      store.conexao = { url: '', chave: '' }; gravarLocal(); render(); toast('Planilha desconectada. Os registros continuam no celular.'); return;
    }
  });

  document.getElementById('app').addEventListener('submit', (ev) => {
    if (ev.target.id !== 'form-peso') return;
    ev.preventDefault();
    const data = document.getElementById('peso-data').value;
    const kg = num(document.getElementById('peso-kg').value);
    if (!data || !/^\d{4}-\d{2}-\d{2}$/.test(data)) { toast('Escolha a data da pesagem.'); return; }
    if (kg == null || kg < 30 || kg > 300) { toast('Digite o peso em kg, por exemplo 118,4.'); return; }
    const p = { data: data, kg: Math.round(kg * 10) / 10, registradoEm: new Date().toISOString() };
    store.pesos[data] = p; espelhar(); enfileirar({ tipo: 'peso', dados: p });
    render(); toast('Peso registrado.');
  });

  function irPara(aba) {
    if (st.aba === 'treino') lerCampos();
    st.aba = VIEWS.indexOf(aba) >= 0 ? aba : 'treino';
    if (st.aba === 'ajustes') { st.rascunho = clone(plano()); st.confirmarPadrao = false; }
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => irPara(location.hash.replace('#', '')));

  /* ---------- Dados ---------- */
  function iniciarSessao() {
    const h = hoje();
    const doDia = st.sessoes.filter((s) => s.data === h).sort((a, b) => ((a.atualizadoEm || '') < (b.atualizadoEm || '') ? 1 : -1))[0];
    if (doDia) { st.sessao = clone(doDia); st.sessaoSalva = true; }
    else { st.sessao = novaSessao(proximoTreino()); st.sessaoSalva = false; }
    st.aberto = st.sessao.status === 'concluido' ? null : primeiroAberto(st.sessao);
  }

  function iniciar() {
    st.aba = (location.hash || '#treino').replace('#', '') || 'treino';
    if (VIEWS.indexOf(st.aba) < 0) st.aba = 'treino';
    carregarLocal();
    espelhar();
    st.pronto = true;
    iniciarSessao();
    render();
    atualizarDaPlanilha().then(() => {
      agendarEnvio(0);
      if (window.Guias) { const p = plano(); Guias.guardarFotos(p.A.concat(p.B).map((e) => e.id)); }
    });
    window.addEventListener('online', () => { st.erroSync = null; agendarEnvio(0); });
    window.addEventListener('offline', atualizarStatus);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { agendarEnvio(0); }
    });
    setInterval(() => { if (store.fila.length) agendarEnvio(0); }, 30000);
  }

  iniciar();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
})();
</script>
</body>
</html>
